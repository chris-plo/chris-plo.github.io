media:
  input: public/images/journal
  output: /images/journal
  categories: [image]
  rename: safe

content:
  - name: journal
    label: Journal & notes
    type: collection
    path: src/content/journal
    exclude:
      - draft-template.md
    filename:
      template: "{published}-{title}.md"
      field: create
    view:
      fields: [title, published, tags, draft]
      primary: title
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
      - name: published
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Keep as draft
        type: boolean
      - name: readingTime
        label: Reading time (minutes)
        type: number
      - name: updated
        label: Last updated
        type: date
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Topics
        type: select
        options:
          multiple: true
          values:
            - value: software-engineering
              label: Software engineering
            - value: artificial-intelligence
              label: Artificial intelligence
            - value: distributed-systems
              label: Distributed systems
            - value: technical-leadership
              label: Technical leadership
            - value: search
              label: Search
            - value: career
              label: Career
            - value: science-and-culture
              label: Science and culture
            - value: life-beyond-code
              label: Life beyond code
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image description
        type: string
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          media: false

settings:
  content:
    merge: true
  commit:
    identity: user
